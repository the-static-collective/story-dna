name: Story DNA Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo > /tmp/story-dna-echo.json
      - run: npm run fork > /tmp/story-dna-fork.json
      - run: npm run characters:demo > /tmp/characters-echo.json
      - run: npm run characters:report > story-dna-character-registry-003.html
      - run: node cli/characters.mjs bank > story-dna-character-bank-import-003.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-dna-character-registry-003
          path: |
            story-dna-character-registry-003.html
            story-dna-character-bank-import-003.json
          retention-days: 30

      - run: node cli/visual.mjs workbench Renji > story-dna-character-mirror-004.html
      - run: node cli/visual.mjs sheet Renji > story-dna-renji-visual-sheet-004.json
      - run: node cli/visual.mjs handoff Renji > story-dna-renji-style-handoff-004.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-dna-character-mirror-004
          path: |
            story-dna-character-mirror-004.html
            story-dna-renji-visual-sheet-004.json
            story-dna-renji-style-handoff-004.json
          retention-days: 30
